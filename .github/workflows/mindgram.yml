name: MindGram iOS

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'MindGram/Bot/**'
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner (macos-15 when macos-26 machines are busy)'
        type: choice
        default: xcode-27
        options:
          - xcode-27
          - macos-26
          - macos-15
          - macos-15-intel
      build_number:
        description: 'Build number (empty: number of published builds + 1)'
        type: string
        default: ''
      configuration:
        description: 'Build configuration'
        type: choice
        default: release_arm64
        options:
          - release_arm64
          - debug_arm64


permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          df -h /
          for x in /Applications/Xcode_*.app; do
            case "$x" in
              *Xcode_26*|*Xcode_27*) ;;
              *) sudo rm -rf "$x" ;;
            esac
          done
          sudo rm -rf /Users/runner/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules /Users/runner/.ghcup || true
          xcrun simctl delete all || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          WANTED=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            XCODE="/Applications/Xcode_$WANTED.app"
          else
            XCODE=$(ls -d /Applications/Xcode_2[67]*.app | sort -V | tail -1)
          fi
          echo "versions.json wants Xcode $WANTED, using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # versions.json pins the Apple Silicon Bazel binary by SHA-256. On an Intel machine Make.py fetches
      # the x86_64 binary, so pin that one instead (same version).
      - name: Bazel for Intel machines
        if: runner.arch == 'X64'
        run: |
          V=$(python3 -c 'import json; print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          mkdir -p build-input
          curl -fL -o "build-input/bazel-$V-darwin-x86_64" "https://github.com/bazelbuild/bazel/releases/download/$V/bazel-$V-darwin-x86_64"
          chmod +x "build-input/bazel-$V-darwin-x86_64"
          SHA=$(shasum -a 256 "build-input/bazel-$V-darwin-x86_64" | cut -d' ' -f1)
          python3 - "$V" "$SHA" <<'PY'
          import json, sys
          path = "versions.json"
          data = json.load(open(path))
          data["bazel"] = sys.argv[1] + ":" + sys.argv[2]
          json.dump(data, open(path, "w"), indent=4)
          PY
          cat versions.json

      - name: Write build configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "Add TELEGRAM_API_ID and TELEGRAM_API_HASH in Settings > Secrets and variables > Actions"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          path = "build-system/appstore-configuration.json"
          configuration = json.load(open(path))
          configuration["api_id"] = os.environ["API_ID"]
          configuration["api_hash"] = os.environ["API_HASH"]
          # The IPA is re-signed with a personal certificate, which carries no iCloud entitlement;
          # Telegram's CloudKit config fetch then throws at launch and the app is killed.
          configuration["enable_icloud"] = False
          json.dump(configuration, open("build-system/mindgram-configuration.json", "w"), indent=4)
          PY

      # Bazel's action cache (--disk_cache) plus its download cache. Every run saves under its own key,
      # failed ones included, and every run restores the newest saved one, so a build that broke or ran
      # out of time continues from what the previous attempt already compiled.
      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/telegram-bazel-cache
            /private/var/tmp/_bazel_runner/cache/repos
          key: bazel-${{ inputs.runner || 'xcode-27' }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bazel-${{ inputs.runner || 'xcode-27' }}-${{ hashFiles('versions.json') }}-
            bazel-${{ hashFiles('versions.json') }}-

      - name: Build
        # Leaves the last hour of the job for saving the cache, even when the build itself times out.
        timeout-minutes: 290
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # MindGram builds are numbered in order: 1, 2, 3... = the number of published builds + 1.
          RELEASES=$(gh release list -R "$GITHUB_REPOSITORY" -L 1000 --json tagName -q 'length')
          BUILD_NUMBER=$(( RELEASES + 1 ))
          if [ -n "${{ inputs.build_number }}" ]; then BUILD_NUMBER="${{ inputs.build_number }}"; fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --continueOnError \
            --configurationPath=build-system/mindgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=${{ inputs.configuration || 'release_arm64' }} \
            --buildNumber=$BUILD_NUMBER

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ~/telegram-bazel-cache
            /private/var/tmp/_bazel_runner/cache/repos
          key: bazel-${{ inputs.runner || 'xcode-27' }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect IPA
        run: |
          # bazel-bin points at the configuration of the last build, which is the one just made.
          # bazel-out also keeps every configuration ever built, so it is only searched as a fallback,
          # newest file first.
          IPA="$GITHUB_WORKSPACE/bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA" ]; then
            IPA=$(find -L "$GITHUB_WORKSPACE/bazel-out" -path '*applebin_ios-ios_arm64*' -name Telegram.ipa -print0 2>/dev/null | xargs -0 ls -t | head -1)
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "Telegram.ipa not found"
            exit 1
          fi
          echo "IPA: $IPA"
          mkdir -p "$GITHUB_WORKSPACE/build/artifacts"
          cp "$IPA" "$GITHUB_WORKSPACE/build/artifacts/MindGram.ipa"
          echo "IPA_PATH=$GITHUB_WORKSPACE/build/artifacts/MindGram.ipa" >> $GITHUB_ENV
          ls -la "$GITHUB_WORKSPACE/build/artifacts"

      - uses: actions/upload-artifact@v4
        with:
          name: MindGram-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          # Several builds may run at once; each takes the next free number instead of overwriting one.
          TAG_NUMBER=$BUILD_NUMBER
          while gh release view "build-$TAG_NUMBER" >/dev/null 2>&1; do
            TAG_NUMBER=$(( TAG_NUMBER + 1 ))
          done
          gh release create "build-$TAG_NUMBER" "$IPA_PATH" \
            --title "MindGram $VERSION ($TAG_NUMBER)" \
            --notes "Unsigned MindGram build. Install with Sideloadly or AltStore using your Apple ID."
